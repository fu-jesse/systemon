# Use the internal LFRC as the 32.768 kHz low-frequency clock source (default: LFXO)
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

# Calibration opportunity every 4 s (skipped when temperature change is small)
CONFIG_CLOCK_CONTROL_NRF_CALIBRATION_PERIOD=4000
